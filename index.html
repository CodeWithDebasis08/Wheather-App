<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .weather-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 320px;
        }

        input {
            padding: 10px;
            width: 80%;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #4facfe;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #00c6ff;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="weather-box">
    <h2>Weather App</h2>

    <input type="text" id="locationInput" placeholder="Enter location">
    <br>
    <button onclick="getWeather()">Get Weather</button>

    <div class="result" id="weatherResult"></div>
</div>

<script>
async function getWeather() {

    const location = document.getElementById("locationInput").value.trim();
    const resultDiv = document.getElementById("weatherResult");

    if (location === "") {
        resultDiv.innerHTML = "Please enter a location!";
        return;
    }

    const apiKey = "9ec79281412f4ff5bcf171738261102";

    // IMPORTANT: using https + encodeURIComponent
    const url = `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${encodeURIComponent(location)}&aqi=yes`;

    resultDiv.innerHTML = "Loading...";

    try {
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Network response was not ok");
        }

        const data = await response.json();

        if (data.error) {
            resultDiv.innerHTML = "Location not found!";
            return;
        }

        const temp = data.current.temp_c;
        const condition = data.current.condition.text;
        const icon = data.current.condition.icon;
        const cityName = data.location.name;
        const country = data.location.country;

        resultDiv.innerHTML = `
            <h3>${cityName}, ${country}</h3>
            <img src="https:${icon}" alt="weather icon">
            <p>🌡 Temperature: <b>${temp}°C</b></p>
            <p>🌤 Condition: ${condition}</p>
        `;

    } catch (error) {
        resultDiv.innerHTML = "Error fetching weather data!";
        console.error(error);
    }
}
</script>

</body>
</html>
